version: '3.8'

services:
    app:
        image: paulgl721/testnodejs-portfolio
        env_file:
            - /configs/.env.dev
        build:
            context: .
            dockerfile: testdockerfile
        ports:
            - "3001:3001"
        depends_on:
            - mongo 

    #mongodb database service
    mongo:
        image: paulgl721/testmongo-portfolio
        build:
            context: ./mongodb
            dockerfile: Dockerfile
        env_file:
            - /configs/.env.dev
        ports:
            - "27017:27017"
        volumes:
            - stagedatabase:/data/db
    
    #web-based mongoDB admin interface
    mongodbadmin:
        image: mongo-express:latest
        ports:
            - "8081:8081"
        env_file:
            - /configs/.env.dev
        depends_on:
            - mongo

volumes:
    stagedatabase:

      
