
version: '3.8'

services:
    testapp:
        image: paulgl721/testnodejs-portfolio
        env_file:
            - ${ENV_FILE_PATH:-./configs/.env.test}
        build:
            context: .
            dockerfile: testdockerfile
        ports:
            - "3002:3002"
        depends_on:
        
            - testmongodb 
        command: bash -c "./wait-for testmongodb:27017 --timeout=60 -- npm run test:unit-inside-docker"
        networks:
            - testnetwork

    #mongodb database service
    testmongodb:
        image: paulgl721/testmongo-portfolio
        build:
            context: ./mongodb
            dockerfile: Dockerfile
            #args:
                #DB_USER: ${DB_USER:-default_user}
                #DB_PASSWORD: ${DB_PASSWORD:-default_password}
                #DB_NAME: ${DB_NAME:-default_database}
        env_file:
            - ${ENV_FILE_PATH:-./configs/.env.test}
        ports:
            - "27018:27017"
        restart: always
        volumes:
            - testdatabase:/data/db     
        networks:
            - testnetwork
    
    #web-based mongoDB admin interface
    testmongodbadmin:
        image: mongo-express:latest
        restart: always
        ports:
            - "8082:8081"
        env_file:
            - ${ENV_FILE_PATH:-./configs/.env.test}
        depends_on:
            - testmongodb
        networks:
            - testnetwork

volumes:
    testdatabase:
networks:
    testnetwork:

      
