version: '3.8'

services:
    portfolioapp: #node.js app
        image: paulgl721/nodejs-portfolio:prodappVJVERSION
        build:
            context: .
            dockerfile: prodDockerfile
        environment:
            NODE_PORT: 3000
        volumes:
            - /glustervol/portfolio/paulgobero/configs/.env.prod:/nodeApp/configs/.env.prod
        networks: #networks to db and reverse proxy
            - traefik_proxy-network 
            - hamongodb_mongodb-network
        #command: bash -c "./wait-for hamongodb_mongo1:27017 --timeout=600 npm run start" #wait for mongodb
        deploy: #using swarm to scale the service to 3 server nodes
            mode: replicated
            replicas: 3
            placement:
                preferences:
                  - spread: node.hostname
            labels: #generate configurations for the reverse proxy
                - "traefik.enable=true" # Enable the service
                - "traefik.docker.network=traefik_proxy-network" #specifiy a network to use
                - "traefik.http.routers.portfolioapp.rule=Host(`www.paulgobero.com`)"
                - "traefik.http.routers.portfolioapp.entrypoints=web,websecure"
                - "traefik.http.routers.portfolioapp.tls=true" #enable tls
                - "traefik.http.routers.portfolioapp.tls.certresolver=production" #certificate
                - "traefik.http.routers.portfolioapp.service=portfolioapp-service"
                - "traefik.http.services.portfolioapp-service.loadbalancer.server.port=3000"
                - "traefik.http.services.portfolioapp-service.loadbalancer.healthcheck.path=/portfolio/readiness"
                - "traefik.http.services.portfolioapp-service.loadbalancer.healthcheck.interval=10s"
                - "traefik.http.services.portfolioapp-service.loadbalancer.healthcheck.timeout=10s"
            restart_policy: #how to restart containers when they exit
                condition: any
                delay: 25s
                max_attempts: 10
                window: 120s
            update_config: #how the service should be updated
                parallelism: 1
                delay: 30s
                failure_action: rollback
                order: start-first
            rollback_config: #how the service should be rolled back in case an update fails
                parallelism: 1
                delay: 10s  

#create the networks between the containers
networks:
    traefik_proxy-network:
        external: true
    hamongodb_mongodb-network:
        external: true
